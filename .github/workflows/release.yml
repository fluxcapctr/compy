name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libcairo2-dev libpango1.0-dev cmake libde265-dev libx265-dev libaom-dev libjpeg-dev libpng-dev imagemagick
      - name: libheif 1.23 (Ubuntu ships an older one)
        run: |
          set -e
          curl -sL https://github.com/strukturag/libheif/releases/download/v1.23.1/libheif-1.23.1.tar.gz | tar xz
          cd libheif-1.23.1
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          sudo ldconfig
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        # The binary looks for the bundled libraries beside itself (~/.local/lib/compy after install.sh).
        run: RUSTFLAGS="-C link-args=-Wl,-rpath,\$ORIGIN/../lib/compy" cargo build --release
      - name: Test
        run: cargo test --release --lib
      - name: Package
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          dir="compy-${v}-linux-x86_64"
          mkdir -p "$dir/assets" "$dir/lib"
          cp target/release/compositor "$dir/"
          # libheif and its codecs travel with the binary: distributions ship older ones.
          for l in $(ldd target/release/compositor | awk '/=> \// {print $3}' | grep -E 'libheif|libde265|libx265|libaom|libdav1d|libsharpyuv|libjpeg|libopenjp|libnuma'); do cp -L "$l" "$dir/lib/"; done
          ls -la "$dir/lib"
          cp install.sh LICENSE README.md "$dir/"
          cp assets/compy-logo.png assets/compy-mark.png assets/compy-design.md "$dir/assets/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
