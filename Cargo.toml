[package]
name = "compositor"
version = "0.1.0"
edition = "2024"
description = "Compositor, a layer-based image editor. Linux port built around the original C pixel core."
license = "MIT"

[lib]
name = "compositor"
path = "src/lib.rs"

[[bin]]
name = "compositor"
path = "src/main.rs"

[dependencies]
libc = "0.2"
flate2 = "1"
anyhow = "1"
cairo-rs = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
libheif-rs = { version = "3", features = ["v1_23"] }
ort = "2.0.0-rc.13"
ureq = "3"
pangocairo = "0.22"
wgpu = "30"
pollster = "1"
ash = "0.38"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
